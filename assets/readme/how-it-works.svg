<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="504" viewBox="0 56 1200 504" role="img" aria-labelledby="title desc">
  <title id="title">How hostblock works</title>
  <desc id="desc">The CLI and the menu bar app talk to the root daemon hostblockd over a Unix socket that only accepts add, list and status. The daemon owns a fenced section of /etc/hosts and, using kqueue, restores it within about 150 ms of any edit, replace, truncate or delete.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9AA3AE"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#30D158"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <rect y="56" width="1200" height="504" rx="24" fill="#12161D"/>

  <!-- clients -->
  <g id="clients" class="sans">
    <rect x="56" y="96" width="250" height="120" rx="14" fill="#1E242D" stroke="#3A404A"/>
    <path d="M100 126 L114 131 V143 C114 152 108 158 100 162 C92 158 86 152 86 143 V131 Z" fill="#ECEEF1"/>
    <text x="128" y="138" font-size="22" font-weight="700" fill="#ECEEF1">Menu bar app</text>
    <text x="128" y="166" font-size="18" fill="#9AA3AE">Swift, per-user</text>
    <text x="80" y="198" font-size="18" fill="#9AA3AE">never shows the list</text>

    <rect x="56" y="300" width="250" height="120" rx="14" fill="#1E242D" stroke="#3A404A"/>
    <text x="80" y="342" font-size="22" font-weight="700" fill="#ECEEF1">CLI</text>
    <text x="80" y="374" class="mono" font-size="18" fill="#ECEEF1">hostblock add</text>
    <text x="80" y="400" class="mono" font-size="18" fill="#9AA3AE">list · status</text>
  </g>

  <!-- socket -->
  <g id="socket" class="sans">
    <path d="M306 156 C350 156 360 250 398 252" fill="none" stroke="#9AA3AE" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M306 360 C350 360 360 270 398 268" fill="none" stroke="#9AA3AE" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="402" y="214" width="190" height="92" rx="14" fill="#1E242D" stroke="#0A84FF"/>
    <text x="497" y="252" font-size="20" font-weight="700" fill="#ECEEF1" text-anchor="middle">Unix socket</text>
    <text x="497" y="282" class="mono" font-size="18" fill="#9AA3AE" text-anchor="middle">0660 root:admin</text>
    <path d="M592 260 L640 260" stroke="#9AA3AE" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- daemon -->
  <g id="daemon" class="sans">
    <rect x="644" y="190" width="200" height="140" rx="14" fill="#1E242D" stroke="#3A404A"/>
    <text x="744" y="230" class="mono" font-size="22" font-weight="700" fill="#ECEEF1" text-anchor="middle">hostblockd</text>
    <text x="744" y="260" font-size="18" fill="#9AA3AE" text-anchor="middle">root LaunchDaemon</text>
    <text x="744" y="292" font-size="18" fill="#ECEEF1" text-anchor="middle">add · list · status</text>
    <text x="744" y="316" font-size="18" fill="#E5484D" text-anchor="middle">no remove verb</text>
  </g>

  <!-- hosts file -->
  <g id="hosts">
    <path d="M844 240 L872 240" stroke="#9AA3AE" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="876" y="96" width="276" height="324" rx="14" fill="#0B0E13" stroke="#3A404A"/>
    <text x="896" y="134" class="sans" font-size="20" font-weight="700" fill="#ECEEF1">/etc/hosts</text>
    <text x="896" y="168" class="mono" font-size="16" fill="#5E6672">127.0.0.1 localhost</text>
    <text x="896" y="190" class="mono" font-size="16" fill="#5E6672">(your lines, untouched)</text>
    <rect x="890" y="208" width="248" height="134" rx="8" fill="#0A84FF" fill-opacity="0.10" stroke="#0A84FF" stroke-dasharray="5 4"/>
    <text x="904" y="234" class="mono" font-size="16" fill="#9AA3AE"># BEGIN hostblock</text>
    <text x="904" y="260" class="mono" font-size="16" fill="#ECEEF1">127.0.0.1 example.com</text>
    <text x="904" y="284" class="mono" font-size="16" fill="#ECEEF1">::1 example.com</text>
    <text x="904" y="308" class="mono" font-size="16" fill="#ECEEF1">...</text>
    <text x="904" y="332" class="mono" font-size="16" fill="#9AA3AE"># END hostblock</text>
    <text x="896" y="378" class="sans" font-size="18" fill="#9AA3AE">the fence the daemon owns</text>
  </g>

  <!-- kqueue revert loop -->
  <g id="revert" class="sans">
    <path d="M1014 420 C1014 520 744 520 744 334" fill="none" stroke="#30D158" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowg)"/>
    <text x="724" y="440" text-anchor="end" font-size="20" font-weight="700" fill="#30D158">kqueue sees any edit</text>
    <text x="724" y="466" text-anchor="end" font-size="18" fill="#9AA3AE">fence restored in ~150 ms</text>
  </g>

</svg>
